<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#dfe3dc">
<title>tuan photography 陳亮元</title>
<meta name="description" content="Landscape photographs by Thomas Chen, on a world painted in ink wash. Choose one of sixteen places: the map draws near, the ink deepens, and the photograph lifts out of the paper.">
<link rel="preload" href="fonts/alegreya-sans/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/alegreya-sans/alegreya-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="ink/ink-4096.jpg" as="image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <mask id="seal-wear" maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1">
      <rect width="1" height="1" fill="#fff"/>
      <g id="seal-wear-specks" fill="#000"></g>
    </mask>
  </defs>
</svg>

<div class="app" id="app">

  <main class="mount" id="mount">
    <div class="map" id="map" tabindex="0" role="application" aria-roledescription="map" aria-describedby="map-hint" data-t-aria="mapLabel" aria-label="Map of the places he has photographed">
      <canvas class="map__ink" id="ink" aria-hidden="true"></canvas>
      <svg class="map__marks" id="marks" aria-hidden="true"></svg>
      <div class="pins" id="pins"></div>
      <p class="sr" id="map-hint" data-t="mapHint">Drag or use the arrow keys to move the map. Scroll, or press plus and minus, to zoom. Tab moves between the places.</p>
    </div>

    <header class="colophon" id="colophon">
      <p class="colophon__name">tuan photography <span lang="zh-Hant">陳亮元</span></p>
      <div class="colophon__say">
        <p class="colophon__line" data-t="line">Travel like a photographer</p>
        <p class="colophon__hint" data-t="hint">Choose a place: the map draws near and its photographs begin.</p>
      </div>
    </header>

    <nav class="chrome" data-t-aria="siteLabel" aria-label="Site">
      <div class="lang" role="group" data-t-aria="langLabel" aria-label="Language">
        <button type="button" class="lang__btn" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="lang__btn" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
      </div>
      <a class="ig" id="ig" href="https://www.instagram.com/tuan_1127/" target="_blank" rel="noopener"><span data-t="ig">Instagram</span> <b>tuan_1127</b></a>
    </nav>

    <figure class="flights" id="flights">
      <button type="button" class="flights__globe" id="flights-globe" data-t-aria="replay" aria-label="Play the flights again">
        <canvas id="flights-canvas" aria-hidden="true"></canvas>
      </button>
      <figcaption class="flights__cap" data-t="flights">Flights</figcaption>
    </figure>

    <div class="zoom" role="group" data-t-aria="zoomGroup" aria-label="Zoom">
      <button class="zoom__btn" id="zoom-in" type="button" data-t="zoomIn">Zoom in</button>
      <button class="zoom__btn" id="zoom-out" type="button" data-t="zoomOut">Zoom out</button>
      <button class="zoom__btn" id="zoom-all" type="button" data-t="zoomAll">Whole map</button>
    </div>

    <aside class="index" id="index" aria-labelledby="index-tab">
      <button class="index__tab" id="index-tab" type="button" aria-expanded="false" aria-controls="index-panel">
        <span class="index__word" data-t="indexTitle">Photographs</span>
        <span class="index__count" id="index-count"></span>
      </button>
      <div class="index__panel" id="index-panel">
        <div class="index__head">
          <h2 class="index__title" data-t="indexTitle">Photographs</h2>
          <button class="index__close" id="index-close" type="button" data-t="close">Close</button>
        </div>
        <div class="index__scroll" id="index-scroll">
          <div class="index__body" id="index-body"></div>
        </div>
      </div>
    </aside>
  </main>

  <div class="opening" id="opening" hidden>
    <canvas class="opening__canvas" id="opening-canvas" aria-hidden="true"></canvas>
    <button type="button" class="opening__skip" id="opening-skip" data-t="skip">Skip</button>
  </div>
</div>

<div class="leaf" id="leaf" role="dialog" aria-modal="true" aria-labelledby="leaf-title" hidden>
  <div class="leaf__bar">
    <button type="button" class="leaf__back" id="leaf-back" data-t="back">Back to the map</button>
    <div class="lang" role="group" data-t-aria="langLabel" aria-label="Language">
      <button type="button" class="lang__btn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="lang__btn" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
    </div>
  </div>
  <div class="leaf__scroll" id="leaf-scroll">
    <figure class="cover" id="cover" hidden>
      <div class="cover__pic" id="cover-pic"></div>
      <div class="cover__shade" aria-hidden="true"></div>
      <figcaption class="cover__cap" id="cover-cap">
        <span class="cover__text">
          <span class="cover__note" id="cover-note"></span>
          <span class="cover__name"><span id="cover-name"></span><span class="cover__country" id="cover-country"></span></span>
          <span class="cover__ll" id="cover-ll"></span>
        </span>
        <button type="button" class="cover__on" id="cover-on"></button>
      </figcaption>
    </figure>
    <div class="leaf__content" id="leaf-content"></div>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
  <figure class="viewer__photo" id="viewer-photo"></figure>
  <div class="viewer__side">
    <div class="viewer__nav">
      <button type="button" class="viewer__btn" id="viewer-prev" data-t="prev">Previous</button>
      <button type="button" class="viewer__btn" id="viewer-next" data-t="next">Next</button>
      <button type="button" class="viewer__btn viewer__btn--close" id="viewer-close" data-t="close">Close</button>
    </div>
    <div class="viewer__text" id="viewer-text"></div>
  </div>
</div>

<p class="sr" id="live" aria-live="polite"></p>

<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
