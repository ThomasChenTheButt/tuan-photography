<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f0e8">
<title>tuan photography 陳亮元</title>
<meta name="description" content="Landscape photographs by Thomas Chen, laid out on a hand-shaded relief map of the places he has travelled. Choose a place: the map descends into it and its photographs begin.">
<link rel="preload" href="fonts/alegreya-sans/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/alegreya-sans/alegreya-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../vendor/relief/GRAY_50M_SR_OB-4096.jpg" as="image">
<link rel="preload" href="../vendor/relief/SR_50M-4096.jpg" as="image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

<div class="atlas" id="atlas">

  <div class="map" id="map" tabindex="0" role="application" aria-roledescription="map" aria-describedby="map-hint" data-t-aria="mapLabel" aria-label="Relief map of the places travelled">
    <canvas class="map__plate" id="plate" aria-hidden="true"></canvas>
    <svg class="map__rings" id="rings" aria-hidden="true"></svg>
    <div class="pins" id="pins"></div>
    <p class="sr" id="map-hint" data-t="mapHint">Drag or use the arrow keys to move the map. Scroll, or press plus and minus, to zoom. Tab moves through the books.</p>
  </div>

  <header class="title" id="title">
    <p class="title__site" data-t="site">tuan photography 陳亮元</p>
    <h1 class="title__name" data-t="plateTitle">Places travelled</h1>
    <p class="title__line" data-t="plateLine">Choose a place: the map descends into its photographs.</p>
  </header>

  <nav class="chrome" data-t-aria="siteLabel" aria-label="Site">
    <div class="lang" role="group" data-t-aria="langLabel" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
    </div>
    <a class="ig" id="ig" href="https://www.instagram.com/tuan_1127/" rel="noopener" target="_blank"><span data-t="ig">Instagram</span> <b>tuan_1127</b></a>
  </nav>

  <div class="foot">
    <div class="zoom" role="group" data-t-aria="zoomGroup" aria-label="Map controls">
      <button type="button" id="zoom-in" data-t="zoomIn">Zoom in</button>
      <button type="button" id="zoom-out" data-t="zoomOut">Zoom out</button>
      <button type="button" id="zoom-all" data-t="zoomAll">Whole map</button>
    </div>
    <p class="credit" data-t="credit">Relief: Natural Earth</p>
  </div>

  <figure class="flights" id="flights">
    <button type="button" class="flights__globe" id="flights-btn" data-t-aria="replay" aria-label="Replay the flights">
      <span class="flights__shadow" aria-hidden="true"></span>
      <span class="flights__stage" id="flights-stage"></span>
    </button>
    <figcaption class="flights__cap" data-t="flights">Flights</figcaption>
  </figure>

  <button type="button" class="tab" id="index-tab" aria-expanded="false" aria-controls="index">
    <span class="tab__word" data-t="indexTab">Photographs</span>
    <span class="tab__n" id="index-n"></span>
  </button>

  <aside class="index" id="index" aria-labelledby="index-title" hidden>
    <header class="index__head">
      <h2 class="index__title" id="index-title" data-t="indexTitle">Index of photographs</h2>
      <p class="index__count" id="index-count"></p>
      <button type="button" class="index__close" id="index-close" data-t="close">Close</button>
    </header>
    <div class="index__scroll" id="index-scroll">
      <div class="index__body" id="index-body"></div>
    </div>
  </aside>

  <div class="opening" id="opening" hidden>
    <span class="opening__shadow" aria-hidden="true"></span>
    <div class="opening__stage" id="opening-stage"></div>
    <button type="button" class="opening__skip" id="opening-skip" data-t="skip">Skip</button>
  </div>

</div>

<div class="leaf" id="leaf" role="dialog" aria-modal="true" aria-labelledby="leaf-title" hidden>
  <div class="leaf__bar">
    <button type="button" class="leaf__back" id="leaf-back" data-t="back">Back to the map</button>
    <p class="leaf__ref" id="leaf-ref"></p>
    <div class="lang" role="group" data-t-aria="langLabel" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
    </div>
  </div>
  <div class="leaf__scroll" id="leaf-scroll">
    <figure class="cover" id="cover" hidden>
      <div class="cover__pic" id="cover-pic"></div>
      <figcaption class="cover__cap" id="cover-cap">
        <span class="cover__note" id="cover-note"></span>
        <b class="cover__name" id="cover-name"></b>
        <span class="cover__ll" id="cover-ll"></span>
        <button type="button" class="cover__on" id="cover-on"></button>
      </figcaption>
    </figure>
    <div class="leaf__content" id="leaf-content"></div>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
  <figure class="viewer__photo" id="viewer-photo"></figure>
  <div class="viewer__side">
    <div class="viewer__nav">
      <button type="button" id="viewer-prev" data-t="prev">Previous</button>
      <button type="button" id="viewer-next" data-t="next">Next</button>
      <button type="button" id="viewer-close" data-t="close">Close</button>
    </div>
    <div class="viewer__text" id="viewer-text"></div>
  </div>
</div>

<p class="sr" id="live" aria-live="polite"></p>

<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
