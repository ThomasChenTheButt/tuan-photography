<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f6f8">
<title>tuan photography 陳亮元</title>
<meta name="description" content="Landscape photographs by Thomas Chen 陳亮元 from sixteen countries, on a globe you can turn. Open a book to see the photographs and the guide.">
<link rel="preload" href="fonts/schibsted-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">EN</button>
  <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
</div>

<div class="map" id="map">
  <header class="top">
    <h1 class="mark">tuan photography <span class="nb">陳亮元</span></h1>
    <a class="ig" id="ig" href="https://www.instagram.com/tuan_1127/" target="_blank" rel="noopener" data-t="follow">Follow on Instagram</a>
  </header>

  <main class="main">
  <div class="stage" id="stage" tabindex="0" role="application" aria-roledescription="globe" aria-label="Globe" aria-describedby="stage-help">
    <canvas class="globe" id="globe" aria-hidden="true"></canvas>
    <div class="pins" id="pins"></div>
    <p class="tag" id="tag" hidden><b></b><span></span></p>
    <p class="sr" id="stage-help" data-t="globeHelp">A globe of the places Thomas Chen has photographed. Arrow keys turn it, plus and minus zoom, Enter opens the book nearest the middle. The list of places opens the same books.</p>
  </div>

  <nav class="places" id="places" aria-labelledby="places-h">
    <div class="places__head">
      <h2 id="places-h" data-t="places">Places</h2>
      <button type="button" class="btn btn--quiet places__close" id="places-close" data-t="hidePlaces">Hide places</button>
    </div>
    <ol class="places__list" id="places-list"></ol>
  </nav>

  <section class="note-card" aria-labelledby="line-h">
    <h2 class="line" id="line-h" data-t="line">Travel like a photographer.</h2>
    <p class="say" id="say"></p>
    <div class="controls">
      <button type="button" class="btn btn--spin" id="spin" data-t="spin">Spin</button>
      <button type="button" class="btn btn--quiet show-places" id="places-open" aria-controls="places" aria-expanded="false" data-t="places">Places</button>
      <button type="button" class="btn btn--quiet" id="zoom-in" data-t="zoomIn">Zoom in</button>
      <button type="button" class="btn btn--quiet" id="zoom-out" data-t="zoomOut">Zoom out</button>
    </div>
  </section>
  </main>

  <p class="sr" id="live" aria-live="polite"></p>
</div>

<section class="page" id="page" hidden aria-labelledby="page-h">
  <div class="page__bar">
    <button type="button" class="btn btn--back" id="back" data-t="back">Back to the map</button>
  </div>
  <div class="page__body" id="page-body"></div>
  <footer class="page__foot">
    <button type="button" class="btn btn--quiet" id="back-2" data-t="back">Back to the map</button>
    <a href="https://www.instagram.com/tuan_1127/" target="_blank" rel="noopener" data-t="follow">Follow on Instagram</a>
  </footer>
</section>

<dialog class="viewer" id="viewer" aria-labelledby="viewer-h">
  <div class="viewer__in">
    <figure class="viewer__fig">
      <span class="viewer__pic" id="viewer-pic"></span>
      <figcaption>
        <h2 id="viewer-h"></h2>
        <p class="viewer__where" id="viewer-where"></p>
        <p class="viewer__data num" id="viewer-data"></p>
        <p class="viewer__extra" id="viewer-extra"></p>
      </figcaption>
    </figure>
    <div class="viewer__bar">
      <button type="button" class="btn btn--quiet" id="viewer-prev" data-t="prev">Previous</button>
      <button type="button" class="btn btn--quiet" id="viewer-next" data-t="next">Next</button>
      <button type="button" class="btn btn--back" id="viewer-close" data-t="close">Close</button>
    </div>
  </div>
</dialog>

<script src="../data.js"></script>
<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
