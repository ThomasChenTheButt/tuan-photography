<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f1f3f4">
<title>tuan photography 陳亮元</title>
<meta name="description" content="Landscape photographs and guides by Thomas Chen, from sixteen places travelled.">
<link rel="preload" href="fonts/fira-sans-condensed-latin-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fira-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#board" data-t="skip">Skip to the departures board</a>

<header class="top">
  <p class="top__name" data-t="site">tuan photography 陳亮元</p>
  <nav class="top__tools" aria-label="Site">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" lang="zh-Hant" aria-pressed="false">中文</button>
    </div>
    <a class="top__ig" id="ig" href="https://www.instagram.com/tuan_1127/" rel="noopener" target="_blank"><span>Instagram</span> tuan_1127</a>
  </nav>
</header>

<main class="hall" id="hall">
  <div class="map" id="map" tabindex="0" role="application" aria-roledescription="map" aria-label="Map of the places travelled. Arrow keys move, plus and minus zoom." data-t-aria="mapLabel">
    <canvas class="map__canvas" id="canvas" aria-hidden="true"></canvas>
    <div class="map__books" id="books"></div>
  </div>

  <section class="board" id="board" aria-labelledby="board-title" tabindex="-1">
    <div class="board__head">
      <svg class="board__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="glyph__plane" d="M12 2.6c.85 0 1.45.95 1.45 2.15V9.1l7.3 4.1v1.95l-7.3-2.25v4.45l2.1 1.65v1.55L12 19.7l-3.55.85V19l2.1-1.65V12.9l-7.3 2.25V13.2l7.3-4.1V4.75c0-1.2.6-2.15 1.45-2.15z" transform="rotate(45 12 11)"/><path class="glyph__ground" d="M2.5 22.25h19"/></svg>
      <h1 class="board__title" id="board-title"><span class="flaps flaps--title" id="title-flaps" aria-hidden="true"></span><span class="sr" data-t="departures">Departures</span></h1>
      <button type="button" class="board__more" id="sheet-toggle" aria-expanded="false" aria-controls="rows" data-t="showAll">Show all</button>
      <p class="board__line" data-t="boardLine">Sixteen places travelled, from home base Taiwan. Choose one to open its book.</p>
    </div>
    <div class="board__cols" aria-hidden="true">
      <span data-t="colWhen">Travelled</span><span data-t="colWhere">Destination</span><span data-t="colRemark">Remarks</span>
    </div>
    <ol class="board__rows" id="rows"></ol>
  </section>

  <div class="dock" role="group" aria-label="Map controls" data-t-aria="controls">
    <p class="readout" id="readout" aria-hidden="true"></p>
    <div class="dock__buttons">
      <button type="button" id="zoom-in" data-t="zoomIn">Zoom in</button>
      <button type="button" id="zoom-out" data-t="zoomOut">Zoom out</button>
      <button type="button" id="zoom-world" data-t="world">Whole map</button>
    </div>
  </div>
</main>

<div class="page" id="page" role="dialog" aria-modal="true" aria-labelledby="page-title" hidden>
  <div class="page__bar">
    <button type="button" class="page__back" id="page-back" data-t="back">Back to the map</button>
    <p class="page__where" id="page-where"></p>
  </div>
  <div class="page__scroll" id="page-scroll" tabindex="-1">
    <div class="page__body" id="page-body"></div>
    <footer class="page__end">
      <a class="page__ig" href="https://www.instagram.com/tuan_1127/" rel="noopener" target="_blank"><span data-t="follow">Follow on Instagram</span> <b>tuan_1127</b></a>
      <button type="button" class="page__back page__back--end" data-close data-t="back">Back to the map</button>
    </footer>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-name" hidden>
  <div class="viewer__bar">
    <button type="button" id="viewer-prev" data-t="prev">Previous</button>
    <button type="button" id="viewer-next" data-t="next">Next</button>
    <button type="button" id="viewer-close" data-t="close">Close</button>
  </div>
  <figure class="viewer__fig">
    <div class="viewer__img" id="viewer-img"></div>
    <figcaption>
      <b id="viewer-name"></b>
      <span class="viewer__where" id="viewer-where"></span>
      <dl class="viewer__data" id="viewer-data"></dl>
    </figcaption>
  </figure>
</div>

<p class="sr" id="live" aria-live="polite"></p>

<script src="../data.js"></script>
<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
