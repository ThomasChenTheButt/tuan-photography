<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f1f2f4">
<title>tuan photography 陳亮元</title>
<meta name="description" content="Landscape photographs by Thomas Chen, on a map pressed into white paper. Choose one of sixteen places: the map draws you in, the relief deepens, and its photograph and guide appear.">
<link rel="preload" href="fonts/alegreya-sans/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/alegreya-sans/alegreya-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../vendor/countries-110m.json" as="fetch" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <div class="map" id="map" tabindex="0" role="application" aria-roledescription="map" aria-describedby="map-hint" data-t-aria="mapLabel" aria-label="Map of the places travelled">
    <canvas class="map__sheet" id="sheet" aria-hidden="true"></canvas>
    <div class="pins" id="pins"></div>
    <p class="tip" id="tip" aria-hidden="true"></p>
    <p class="sr" id="map-hint" data-t="mapHint">Drag or use the arrow keys to move the map. Scroll, or press plus and minus, to zoom. Tab moves between the places.</p>
  </div>

  <header class="mast">
    <p class="mast__name">tuan photography <span lang="zh-Hant">陳亮元</span></p>
    <p class="mast__line" data-t="lineMap">Sixteen places travelled. Choose one to go in.</p>
  </header>

  <nav class="chrome" data-t-aria="siteLabel" aria-label="Site">
    <button type="button" class="word chrome__index" id="index-open" aria-expanded="false" aria-controls="index"><span data-t="indexOpen">Photographs</span> <span class="chrome__n" id="index-n"></span></button>
    <div class="lang" role="group" data-t-aria="langLabel" aria-label="Language">
      <button type="button" class="word lang__btn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="word lang__btn" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
    </div>
    <a class="ig" id="ig" href="https://www.instagram.com/tuan_1127/" target="_blank" rel="noopener"><span data-t="ig">Instagram</span> <b>tuan_1127</b></a>
  </nav>

  <div class="zoom" role="group" data-t-aria="zoomGroup" aria-label="Zoom">
    <button type="button" class="word zoom__btn" id="zoom-in" data-t="zoomIn">Zoom in</button>
    <button type="button" class="word zoom__btn" id="zoom-out" data-t="zoomOut">Zoom out</button>
    <button type="button" class="word zoom__btn" id="zoom-all" data-t="world">Whole map</button>
    <p class="credit" data-t="credit">Relief and coastlines: Natural Earth</p>
  </div>

  <figure class="flights" id="flights">
    <button type="button" class="flights__globe" id="flights-btn" data-t-aria="flightsAria" aria-label="Flights: play the routes again">
      <canvas id="globe" aria-hidden="true"></canvas>
    </button>
    <figcaption class="flights__cap" data-t="flights">Flights</figcaption>
  </figure>

  <aside class="index" id="index" aria-labelledby="index-title" inert>
    <header class="index__head">
      <h2 class="index__title" id="index-title" data-t="indexTitle">Photographs</h2>
      <p class="index__count" id="index-count"></p>
      <button type="button" class="word index__close" id="index-close" data-t="close">Close</button>
    </header>
    <div class="index__scroll" id="index-scroll">
      <div class="index__body" id="index-body"></div>
    </div>
  </aside>

  <div class="opening" id="opening" hidden>
    <canvas class="opening__canvas" id="opening-canvas" aria-hidden="true"></canvas>
    <button type="button" class="word opening__skip" id="opening-skip" data-t="skip">Skip</button>
  </div>

</div>

<div class="leaf" id="leaf" role="dialog" aria-modal="true" aria-labelledby="leaf-title" hidden>
  <div class="leaf__bar">
    <button type="button" class="word leaf__back" id="leaf-back" data-t="back">Back to the map</button>
    <div class="lang" role="group" data-t-aria="langLabel" aria-label="Language">
      <button type="button" class="word lang__btn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="word lang__btn" data-lang="zh" aria-pressed="false" lang="zh-Hant">中文</button>
    </div>
  </div>
  <div class="leaf__scroll" id="leaf-scroll">
    <div class="leaf__content" id="leaf-content"></div>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
  <figure class="viewer__photo" id="viewer-photo"></figure>
  <div class="viewer__side">
    <div class="viewer__nav">
      <button type="button" class="word" id="viewer-prev" data-t="prev">Previous</button>
      <button type="button" class="word" id="viewer-next" data-t="next">Next</button>
      <button type="button" class="word" id="viewer-close" data-t="close">Close</button>
    </div>
    <div class="viewer__text" id="viewer-text"></div>
  </div>
</div>

<p class="sr" id="live" aria-live="polite"></p>

<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
