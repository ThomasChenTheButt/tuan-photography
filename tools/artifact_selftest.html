<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifact self-test</title>
<!-- Test-only page. tools/build_artifact.py --selftest copies it in as selftest.html;
     it is never part of the normal build. Inside the published Artifact it opens every
     page of the site in a same-origin frame at phone and desktop width and reports:
     stylesheet, script, fonts, images, links, scrolling, overflow, menu, language
     switch and the photo viewer. Open the artifact link with #selftest to run it. -->
<style>
  body { font: 12px/1.45 ui-monospace, Menlo, monospace; background: #f7f2e9; color: #2a2521; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  #env { margin: 0 0 10px; color: #6b625a; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #cfc5b8; padding: 1px 6px; text-align: left; white-space: nowrap; }
  td.notes { white-space: normal; max-width: 420px; }
  .ok { color: #1d6b2f; }
  .bad { color: #a8321f; font-weight: 700; }
  iframe { border: 1px solid #cfc5b8; height: 700px; display: block; margin-top: 14px; }
</style>
</head>
<body>
<h1 id="summary">running…</h1>
<p id="env"></p>
<table>
  <thead><tr>
    <th>page</th><th>load</th><th>css</th><th>js</th><th>fonts</th><th>img</th><th>links</th>
    <th>scroll</th><th>w375</th><th>w1280</th><th>menu</th><th>中/EN</th><th>viewer</th><th>errors</th><th class="notes">notes</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<iframe id="stage" title="page under test"></iframe>
<script>
const PAGES = /*PAGES*/[];
const FONTS = ['Playfair Display', 'Geist', 'Noto Serif TC', 'Noto Sans TC'];
const stage = document.getElementById('stage');
const rows = document.getElementById('rows');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const statusCache = new Map();

async function exists(url) {
  if (!statusCache.has(url)) statusCache.set(url, fetch(url).then(r => r.status).catch(() => 0));
  return (await statusCache.get(url)) === 200;
}

function load(path, width) {
  return new Promise(resolve => {
    const errors = [];
    stage.style.width = width + 'px';
    let hooked = null;
    const hook = setInterval(() => {
      let w;
      try { w = stage.contentWindow; if (w.location.href === 'about:blank') return; } catch (e) { return; }
      if (w === hooked) return;
      hooked = w;
      w.addEventListener('error', e => {
        const t = e.target;
        errors.push(t && t !== w && (t.src || t.href) ? 'load failed: ' + (t.src || t.href) : 'script: ' + e.message);
      }, true);
      w.addEventListener('unhandledrejection', e => errors.push('promise: ' + e.reason));
      w.document.addEventListener('securitypolicyviolation', e => errors.push('blocked: ' + e.blockedURI));
    }, 1);
    const done = ok => { clearInterval(hook); clearTimeout(timer); stage.onload = null; resolve({ ok, errors }); };
    const timer = setTimeout(() => done(false), 20000);
    stage.onload = () => done(true);
    stage.src = path;
  });
}

async function check(path) {
  const r = { path, notes: [] };
  const first = await load(path, 375);
  r.errors = first.errors;
  let doc, win;
  try { win = stage.contentWindow; doc = win.document; } catch (e) { doc = null; }
  r.load = first.ok && !!doc && !!doc.querySelector('.top') && !!doc.querySelector('.foot');
  if (!r.load) { r.notes.push('page did not load in a frame'); return r; }
  await sleep(700);
  /* a 中文 browser opens in 中文 (main.js reads navigator.language), so both are right */
  if (!['en', 'zh-Hant'].includes(doc.documentElement.lang)) r.errors.push('lang attribute is "' + doc.documentElement.lang + '" on load');

  const sheetOk = name => {
    const s = [...doc.styleSheets].find(x => (x.href || '').includes(name));
    try { return !!s && s.cssRules.length > 0; } catch (e) { return false; }
  };
  r.css = sheetOk('css/style.css') && sheetOk('css/fonts.css');

  /* main.js ends by defining fromAddress; if it exists, the whole script ran */
  const probe = doc.createElement('script');
  probe.textContent = "document.documentElement.dataset.mainjs = typeof fromAddress + '/' + typeof setLang;";
  doc.body.appendChild(probe);
  r.js = doc.documentElement.dataset.mainjs === 'function/function';
  if (!r.js) r.notes.push('main.js did not finish: ' + doc.documentElement.dataset.mainjs);

  r.imgCount = doc.images.length;
  r.img = true;
  for (const img of doc.images) {
    const shown = img.complete && img.naturalWidth > 0;
    if (!shown && !(await exists(img.currentSrc || img.src))) { r.img = false; r.notes.push('image missing: ' + img.getAttribute('src')); }
  }

  r.links = true; r.linkCount = 0; r.external = 0;
  for (const a of doc.querySelectorAll('a[href]')) {
    const raw = a.getAttribute('href');
    if (raw === '#') continue;
    if (raw.startsWith('#')) {
      if (!raw.startsWith('#view-') && !doc.getElementById(raw.slice(1))) { r.links = false; r.notes.push('no anchor ' + raw); }
      continue;
    }
    const url = new URL(raw, doc.baseURI);
    if (url.origin !== location.origin) {
      r.external++;
      if (a.target !== '_blank') r.notes.push('external link without new tab: ' + raw);
      continue;
    }
    r.linkCount++;
    url.hash = '';
    if (!(await exists(url.href))) { r.links = false; r.notes.push('broken link: ' + raw); }
  }

  const tall = doc.scrollingElement.scrollHeight - win.innerHeight;
  win.scrollTo({ top: 300, behavior: 'instant' });
  r.scroll = tall <= 0 || win.scrollY > 0;
  if (!r.scroll) r.notes.push('page is ' + tall + 'px taller than the frame but will not scroll');
  win.scrollTo({ top: 0, behavior: 'instant' });

  const overflow = () => Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth) - win.innerWidth;
  r.w375 = overflow() <= 1;
  if (!r.w375) r.notes.push('375px: ' + overflow() + 'px too wide');

  const btn = doc.querySelector('.menu-btn');
  const menu = doc.querySelector('.menu');
  if (btn && menu && win.getComputedStyle(btn).display !== 'none') {
    btn.click();
    r.menu = menu.classList.contains('open') && btn.getAttribute('aria-expanded') === 'true';
    btn.click();
    r.menu = r.menu && !menu.classList.contains('open');
  } else { r.menu = false; r.notes.push('menu button not shown at 375px'); }

  const zh = doc.getElementById('lang-zh'), en = doc.getElementById('lang-en');
  const nav = doc.querySelector('.menu a');
  if (zh && en && nav) {
    zh.click();
    let stored = null;
    try { stored = win.localStorage.getItem('tlap-lang'); } catch (e) { r.notes.push('storage blocked'); }
    const zhOk = doc.documentElement.lang === 'zh-Hant' && nav.textContent === '作品集' && zh.getAttribute('aria-pressed') === 'true';
    const untranslated = [...doc.querySelectorAll('[data-i18n]')].filter(el => !/[㐀-鿿]/.test(el.textContent)).length;
    /* fonts: measured while the 中文 text is showing, so both Noto families are in use */
    try { await Promise.race([doc.fonts.ready, sleep(6000)]); } catch (e) {}
    const loaded = new Set([...doc.fonts].filter(f => f.status === 'loaded').map(f => f.family.replace(/["']/g, '')));
    const failed = [...doc.fonts].filter(f => f.status === 'error').length;
    const missing = FONTS.filter(f => !loaded.has(f));
    r.fonts = missing.length === 0 && failed === 0;
    if (missing.length) r.notes.push('fonts not loaded: ' + missing.join(', '));
    if (failed) r.errors.push(failed + ' font files failed to load');
    en.click();
    r.lang = zhOk && stored === 'zh' && doc.documentElement.lang === 'en' && nav.textContent === 'Gallery';
    if (untranslated) r.notes.push(untranslated + ' strings without 中文 characters');
  } else { r.lang = false; r.fonts = false; r.notes.push('language buttons not found'); }

  const slide = doc.querySelector('a[data-slide]');
  if (slide) {
    win.document.startViewTransition = undefined; /* the fade needs painted frames; a hidden tab has none */
    slide.click();
    await sleep(300);
    const dialog = doc.querySelector('dialog.viewer');
    const big = doc.getElementById('viewer-img');
    const place = doc.getElementById('viewer-place');
    const imgOk = !!big && (big.complete && big.naturalWidth > 0 || await exists(big.src));
    r.viewer = !!dialog && dialog.open && imgOk && !!place && place.textContent.length > 0;
    if (!r.viewer) r.notes.push('photo viewer did not open properly');
    doc.getElementById('viewer-close')?.click();
    await sleep(100);
    if (dialog && dialog.open) { r.viewer = false; r.notes.push('photo viewer did not close'); }
    r.notes.push(doc.querySelectorAll('a[data-slide]').length + ' photos open in the viewer');
  } else { r.viewer = true; }

  stage.style.width = '1280px';
  await sleep(350);
  r.w1280 = overflow() <= 1;
  if (!r.w1280) r.notes.push('1280px: ' + overflow() + 'px too wide');
  r.notes.unshift(r.imgCount + ' img, ' + r.linkCount + ' links, ' + r.external + ' external');
  return r;
}

function cell(v) { return '<td class="' + (v ? 'ok' : 'bad') + '">' + (v ? 'ok' : 'FAIL') + '</td>'; }

(async () => {
  document.getElementById('env').textContent = location.origin.replace(/\/\/[^.]+/, '//…') + ' · ' + navigator.userAgent.replace(/.*(Chrome\/[\d]+).*/, '$1');
  /* controls: prove the checks can fail */
  const missing = !(await exists('no-such-page.html'));
  const blocked = await new Promise(resolve => {
    const t = setTimeout(() => resolve(false), 4000);
    document.addEventListener('securitypolicyviolation', () => { clearTimeout(t); resolve(true); }, { once: true });
    const probe = new Image();
    probe.onload = () => { clearTimeout(t); resolve(false); };
    probe.src = 'https://example.com/probe.png';
  });
  document.getElementById('env').textContent += ' · controls: missing file detected=' + missing + ', outside host blocked=' + blocked;

  let pass = 0;
  for (const path of PAGES) {
    const r = await check(path);
    const good = r.load && r.css && r.js && r.fonts && r.img && r.links && r.scroll && r.w375 && r.w1280 && r.menu && r.lang && r.viewer && r.errors.length === 0;
    if (good) pass++;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + path + '</td>' + [r.load, r.css, r.js, r.fonts, r.img, r.links, r.scroll, r.w375, r.w1280, r.menu, r.lang, r.viewer].map(cell).join('')
      + '<td class="' + (r.errors.length ? 'bad' : 'ok') + '">' + r.errors.length + '</td><td class="notes"></td>';
    tr.lastChild.textContent = r.notes.concat(r.errors).join(' · ');
    rows.appendChild(tr);
    document.getElementById('summary').textContent = 'running… ' + rows.children.length + '/' + PAGES.length;
  }
  const s = document.getElementById('summary');
  s.textContent = (pass === PAGES.length ? 'PASS ' : 'FAIL ') + pass + '/' + PAGES.length + ' pages clean';
  s.className = pass === PAGES.length ? 'ok' : 'bad';
  stage.remove();
  const foot = document.createElement('p');
  foot.className = s.className;
  foot.textContent = s.textContent + ' · ' + document.getElementById('env').textContent;
  document.body.appendChild(foot);
  window.scrollTo({ top: document.scrollingElement.scrollHeight, behavior: 'instant' });
})();
</script>
</body>
</html>
