<!DOCTYPE html>
<html lang="en" data-root="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>tuan photography 陳亮元</title>
  <meta name="description" content="Landscape and city photographs by Thomas Chen 陳亮元 from 21 countries on four continents.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="tuan photography 陳亮元">
  <meta property="og:title" content="tuan photography 陳亮元">
  <meta property="og:description" content="Landscape and city photographs by Thomas Chen 陳亮元 from 21 countries on four continents.">
  <meta property="og:image" content="images/web/1280/new-zealand-aoraki-window.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="page-cine page-film" data-page="places" data-own-entrances="1">

<div class="cine-intro" id="intro" aria-hidden="true">
  <div class="cine-intro__half cine-intro__half--top"></div>
  <div class="cine-intro__half cine-intro__half--bottom"></div>
  <div class="cine-intro__count"><span class="cine-intro__n" id="intro-n">00</span><span class="cine-intro__place" id="intro-place"></span></div>
</div>

<main id="main" tabindex="-1">

  <!-- 1. the hero: one photograph, held; the coordinates travel from home to the place -->
  <section class="film-hero" id="hero" aria-labelledby="hero-title">
    <h1 class="sr" id="hero-title" data-t="heroTitle">tuan photography, landscape photographs by Thomas Chen</h1>
    <div class="film-hero__frame" id="hero-frame">
      <canvas class="film-hero__globe" id="hero-globe" aria-hidden="true"></canvas>
      <div class="film-hero__photo" id="hero-photo" data-set></div>
      <div class="film-hero__shade" aria-hidden="true"></div>
      <div class="film-hero__words">
        <p class="film-hero__place mono" id="hero-where"></p>
        <p class="film-hero__name" id="hero-name"><span class="line-mask"><span id="hero-name-in"></span></span></p>
        <p class="film-hero__coord mono" id="hero-coord"></p>
      </div>
      <div class="film-hero__bar">
        <a class="btn btn--solid" href="#globe-sec" data-t="go">See where I've been</a>
        <p class="film-hero__by" data-t="heroBy">Thomas Chen, landscape photographer</p>
      </div>
    </div>
  </section>

  <!-- 2. the record, read word by word -->
  <section class="cine-say wrap" aria-label="In short" data-t-aria="inShort">
    <p class="cine-say__text" id="say"></p>
  </section>

  <!-- 3. one camera: the globe, and the descent into each continent -->
  <section class="film" id="globe-sec" aria-labelledby="globe-h">
    <div class="film__stick">
      <h2 class="sr" id="globe-h" data-t="globeH">Where the trips went</h2>
      <canvas class="film__globe" id="globe" role="img" data-t-aria="globeLabel"></canvas>
      <div class="film__scenes" id="scenes"></div>
      <nav class="film__steps mono" id="globe-steps" aria-label="Continents" data-t-aria="continents"></nav>
    </div>
  </section>

  <!-- 4. every country -->
  <section class="cine-index wrap" aria-labelledby="index-h">
    <h2 class="cine-index__h" id="index-h" data-t="indexH">Every country</h2>
    <ol class="cine-index__list" id="index" data-set></ol>
    <div class="cine-index__peek" id="peek" aria-hidden="true"><img alt=""></div>
  </section>

  <!-- 5. the close, on a photograph -->
  <section class="film-close" aria-labelledby="close-h">
    <div class="film-close__photo" id="close-photo" data-set></div>
    <div class="film-close__shade" aria-hidden="true"></div>
    <div class="film-close__run" aria-hidden="true"><div class="cine-close__track" id="next-track"></div></div>
    <div class="wrap film-close__say">
      <h2 class="cine-close__h" id="close-h" data-t="closeT">Where next?</h2>
      <p class="cine-close__p" data-t="closeP">South America is in research. Africa and Antarctica are empty pages.</p>
      <div class="close__ways">
        <a class="btn btn--solid" id="close-ig" target="_blank" rel="noopener"></a>
        <a class="link" href="journeys.html" data-t="trips">Follow the journeys</a>
        <a class="link" href="photos.html" data-t="all">Every photograph</a>
        <a class="link" href="about.html" data-t="about">About me</a>
      </div>
    </div>
  </section>

</main>

<script src="data.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="js/core.js"></script>
<script src="js/heroes.js"></script>
<script src="js/intros.js"></script>
<script src="js/film.js"></script>
</body>
</html>
