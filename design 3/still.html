<!DOCTYPE html>
<html lang="en" data-root="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>tuan photography 陳亮元</title>
  <meta name="description" content="Landscape and city photographs by Thomas Chen 陳亮元 from 21 countries on four continents.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="tuan photography 陳亮元">
  <meta property="og:title" content="tuan photography 陳亮元">
  <meta property="og:description" content="Landscape and city photographs by Thomas Chen 陳亮元 from 21 countries on four continents.">
  <meta property="og:image" content="images/web/1280/new-zealand-aoraki-window.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#07080b">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="page-cine page-still" data-page="places" data-own-entrances="1">

<main id="main" tabindex="-1">

  <!-- 1. the photograph, bare; its name beneath -->
  <section class="still-hero" aria-labelledby="hero-title">
    <h1 class="sr" id="hero-title" data-t="heroTitle">tuan photography, landscape photographs by Thomas Chen</h1>
    <div class="still-hero__ph" id="hero-photo"></div>
    <div class="wrap still-cap">
      <p><span class="still-cap__place" data-w="place:aoraki"></span> <span class="still-cap__where" data-w="where:aoraki"></span></p>
      <p class="still-cap__by" data-t="heroBy">Thomas Chen, landscape photographer</p>
    </div>
  </section>

  <!-- 2. the record, one sentence -->
  <section class="still-say wrap" aria-label="In short" data-t-aria="inShort">
    <p class="still-say__text" id="say"></p>
  </section>

  <!-- 3. the globe, once; it turns as you pass it -->
  <section class="still-globe" aria-labelledby="globe-h">
    <div class="still-globe__stick">
      <h2 class="still-h wrap" id="globe-h" data-t="globeH">Where the trips went</h2>
      <canvas class="still-globe__cv" id="globe" role="img" data-t-aria="globeLabel"></canvas>
    </div>
  </section>

  <!-- 4. the continents: one photograph each, name and countries beneath -->
  <div id="conts"></div>

  <!-- 5. every country -->
  <section class="cine-index still-index wrap" aria-labelledby="index-h">
    <h2 class="still-h" id="index-h" data-t="indexH">Every country</h2>
    <ol class="cine-index__list" id="index"></ol>
    <div class="cine-index__peek" id="peek" aria-hidden="true"><img alt=""></div>
  </section>

  <!-- 6. the close -->
  <section class="still-close" aria-labelledby="close-h">
    <div class="still-close__ph" id="close-photo"></div>
    <div class="wrap still-close__say">
      <h2 class="still-h" id="close-h" data-t="closeT">Where next?</h2>
      <p class="still-close__p" data-t="closeP">South America is in research. Africa and Antarctica are empty pages.</p>
      <div class="close__ways">
        <a class="btn btn--solid" id="close-ig" target="_blank" rel="noopener"></a>
        <a class="link" href="journeys.html" data-t="trips">Follow the journeys</a>
        <a class="link" href="photos.html" data-t="all">Every photograph</a>
        <a class="link" href="about.html" data-t="about">About me</a>
      </div>
    </div>
  </section>

</main>

<script src="data.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="js/core.js"></script>
<script src="js/still.js"></script>
</body>
</html>
