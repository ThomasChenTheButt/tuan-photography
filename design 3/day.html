<!DOCTYPE html>
<html lang="en" data-root="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One day of light · tuan photography 陳亮元</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Landscape and city photographs by Thomas Chen 陳亮元, each placed at the local hour it was taken.">
  <meta name="theme-color" content="#0d1424">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="day" data-hour="05:00" data-own-entrances="1">
<main id="main" tabindex="-1">

  <section class="hero wrap" data-act="hero" aria-labelledby="h-hero">
    <div class="hero__grid">
      <div class="hero__say">
        <p class="cap" data-t="heroBy">Thomas Chen, landscape photographer</p>
        <h1 class="display" id="h-hero"><span class="line-mask"><span data-t="heroA">One day</span></span><span class="line-mask"><span data-t="heroB">of light</span></span></h1>
        <p class="lede" id="hero-lede"></p>
        <p class="hero__hint mono" data-t="dialHint"></p>
      </div>
      <div class="hero__slot" aria-hidden="true"></div>
    </div>
  </section>

  <section class="act wrap" data-act="first" aria-labelledby="h-first">
    <div class="first">
      <div class="first__ph" id="first-ph"></div>
      <div class="first__say">
        <p class="first__time" id="first-time"></p>
        <h2 class="cap" id="h-first" data-t="firstT">First light</h2>
        <p id="first-say"></p>
      </div>
    </div>
  </section>

  <section class="act wrap" data-act="morning" aria-labelledby="h-morning">
    <header class="act__head" data-in>
      <h2 class="display h-act" id="h-morning" data-t="morningT">Morning</h2>
      <p class="act__range mono" id="morning-range"></p>
      <p id="morning-say"></p>
    </header>
    <div class="collage" id="morning" data-set></div>
  </section>

  <section class="act" data-act="midday" aria-labelledby="h-midday">
    <header class="act__head wrap" data-in>
      <h2 class="display h-act" id="h-midday" data-t="middayT">Midday</h2>
      <p class="act__range mono" id="midday-range"></p>
      <p id="midday-say"></p>
    </header>
    <div class="rail" id="midday-rail"><div class="rail__track" id="midday" data-set></div></div>
  </section>

  <section class="act wrap" data-act="afternoon" aria-labelledby="h-afternoon">
    <header class="act__head" data-in>
      <h2 class="display h-act" id="h-afternoon" data-t="afternoonT">Afternoon</h2>
      <p class="act__range mono" id="afternoon-range"></p>
      <p id="afternoon-say"></p>
    </header>
    <div class="rows" id="afternoon" data-set></div>
  </section>

  <section class="peak" data-act="peak" aria-labelledby="h-peak">
    <div class="peak__head">
      <p class="cap" id="peak-range"></p>
      <h2 class="display" id="h-peak" data-t="peakT">Golden hour, then blue</h2>
    </div>
    <div class="peak__stage" id="peak" data-set></div>
    <div class="peak__read" aria-live="polite">
      <p class="peak__sun" id="peak-sun">+0.0°</p>
      <p class="peak__where" id="peak-where"></p>
    </div>
    <div class="peak__bar" aria-hidden="true"><i id="peak-bar"></i></div>
  </section>

  <section class="act wrap" data-act="night" aria-labelledby="h-night">
    <header class="act__head" data-in>
      <h2 class="display h-act" id="h-night" data-t="nightT">Night</h2>
      <p class="act__range mono" id="night-range"></p>
      <p id="night-say"></p>
    </header>
    <div class="night" id="night" data-set></div>
  </section>

  <section class="act wrap" data-act="late" aria-labelledby="h-late">
    <header class="act__head" data-in>
      <h2 class="display h-act" id="h-late" data-t="lateT">After midnight</h2>
      <p class="act__range mono" id="late-range"></p>
      <p id="late-say"></p>
    </header>
    <div class="late" id="late" data-set></div>
  </section>

  <section class="close wrap" data-act="close" aria-labelledby="h-close">
    <p class="cap" id="close-cap"></p>
    <h2 class="display" id="h-close" data-t="closeT">Then it is morning somewhere else.</h2>
    <div class="close__ways">
      <a class="btn btn--solid" href="journeys.html" data-t="closeTrips">Follow the journeys</a>
      <a class="btn" href="photos.html" data-t="closePhotos">Every photograph</a>
      <a class="btn" href="guides/barcelona.html" data-t="closeGuide">The Barcelona guide</a>
    </div>
    <div class="close__foot">
      <a class="link" id="close-ig" target="_blank" rel="noopener"></a>
      <p data-t="footLine"></p>
    </div>
  </section>

</main>

<div class="dial" id="dial" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="1439" aria-label="The hour of the photograph on screen">
  <div class="dial__lens" aria-hidden="true"><img alt=""><img alt=""></div>
  <svg viewBox="-50 -50 100 100" aria-hidden="true"><g id="dial-ticks"></g><circle class="dial__ring" r="44"></circle><g id="dial-shots"></g>
    <line class="dial__hand" id="dial-hand" x1="0" y1="0" x2="0" y2="38"></line><circle class="dial__hub" r="1.6"></circle></svg>
  <div class="dial__face"><span class="dial__time" id="dial-time">05:00</span><span class="dial__light" id="dial-light"></span><span class="dial__place" id="dial-place"></span></div>
  <span class="dial__tip" id="dial-tip"></span>
</div>

<script src="data.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="js/core.js"></script>
<script src="js/home.js"></script>
</body>
</html>
